name: Deploy Web to S3

on:
  push:
    branches: [main]
    paths:
      - "apps/anakloud-core-app/**"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @anakloud/anakloud-core-app build:web
        env:
          EXPO_PUBLIC_API_URL: https://core.api.anakloud.com

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GithubActions
          aws-region: ap-southeast-1

      - name: Upload folder to S3
        run: |
          aws s3 sync ./apps/anakloud-core-app/dist s3://${{ vars.AWS_S3_BUCKET }}/ --delete

      - name: Invalidate Distribution Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
