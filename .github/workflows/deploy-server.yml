name: Deploy Anakloud Core Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/anakloud-core-server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build server
        run: cd apps/anakloud-core-server && bun run build

      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: apps/anakloud-core-server/dist/index.js
          target: /home/ec2-user/anakloud-core-server/dist
          strip_components: 3

      - name: Restart server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: sudo systemctl restart anakloud-core-server
